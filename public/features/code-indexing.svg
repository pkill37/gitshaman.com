<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">Code indexing illustration</title>
  <desc id="desc">Repository files flowing into a searchable symbol index.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffdf7e"/>
      <stop offset="0.4" stop-color="#ff8fb8"/>
      <stop offset="0.72" stop-color="#63d8c9"/>
      <stop offset="1" stop-color="#b9f97d"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="640" height="420" rx="34" fill="#111017"/>
  <g fill="#17171f" stroke="#ffffff" stroke-opacity="0.08">
    <rect x="58" y="82" width="142" height="86" rx="16"/>
    <rect x="58" y="194" width="142" height="86" rx="16"/>
    <rect x="58" y="306" width="142" height="54" rx="16"/>
  </g>
  <path d="M88 115h78M88 140h52M88 227h82M88 252h44M88 334h70" stroke="#aaa4b3" stroke-width="9" stroke-linecap="round" opacity="0.54"/>
  <path d="M218 125h122M218 237h122M218 333h122" stroke="url(#g)" stroke-width="6" stroke-linecap="round" stroke-dasharray="11 14"/>
  <rect x="340" y="86" width="242" height="248" rx="24" fill="#17171f" stroke="url(#g)" stroke-opacity="0.62" filter="url(#glow)"/>
  <circle cx="462" cy="180" r="58" fill="#0f0e15" stroke="#63d8c9" stroke-width="8"/>
  <path d="M502 220l48 48" stroke="#efc66f" stroke-width="14" stroke-linecap="round"/>
  <path d="M406 299h112M406 130h84M406 325h78" stroke="#aaa4b3" stroke-width="9" stroke-linecap="round" opacity="0.5"/>
  <path d="M436 178h53M462 152v53" stroke="#63d8c9" stroke-width="8" stroke-linecap="round"/>
